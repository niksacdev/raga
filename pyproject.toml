[project]
name = "raga"
version = "0.1.0"
description = "Local MCP telemetry simulator for evaluating robot operator assistance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5,<3",
    "mcp>=1.30,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "pip-audit>=2.9.0",
]
